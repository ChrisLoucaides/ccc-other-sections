<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Limit Break — Sponsor Overlay</title>
<!-- The sponsor list comes from the full-screen rotator one folder up, so
     there is only ever one list to keep up to date. -->
<script src="../sponsors.js"></script>
<link rel="stylesheet" href="overlay.css">
</head>
<body>

  <!-- No backdrop: this sits over live gameplay, so everything outside the
       card stays transparent. -->
  <div class="stage-fit">
    <div class="stage" id="stage">

      <div class="card" id="card">
        <p class="card__label" id="label"></p>

        <div class="card__stack" id="stack"></div>

        <p class="card__name" id="name"></p>

        <div class="card__timer" id="timer" hidden></div>
      </div>

    </div>
  </div>

  <script src="overlay.js"></script>
  <script src="app.js"></script>
</body>
</html>
