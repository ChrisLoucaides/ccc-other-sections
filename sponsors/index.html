<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Limit Break — Sponsor Rotator</title>
<!-- The shared look (backdrop, panel, type, progress line) comes from the main
     rotator; sponsors.css only adds the sponsor card and its swap. -->
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="sponsors.css">
</head>
<body>

  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__wash"></div>
    <div class="backdrop__bloom"></div>
    <div class="backdrop__halftone backdrop__halftone--fine"></div>
    <div class="backdrop__halftone backdrop__halftone--coarse"></div>
    <div class="backdrop__vignette"></div>
  </div>

  <div class="stage-fit">
    <div class="stage" id="stage">

      <img class="brandmark" id="brandmark" src="../assets/ccc.png" alt="Cyprus Comic Con">

      <!-- One scene, built once. The Limit Break panel on the left never
           leaves; only the sponsor inside the card on the right changes. -->
      <div class="slide scene" id="scene">

        <div class="where" id="where">
          <svg class="where__pin" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2C7.9 2 4.5 5.4 4.5 9.5c0 5.6 7.5 12.5 7.5 12.5s7.5-6.9 7.5-12.5C19.5 5.4 16.1 2 12 2zm0 10.2a2.7 2.7 0 110-5.4 2.7 2.7 0 010 5.4z"/>
          </svg>
          <span class="where__name" id="whereName"></span>
        </div>

        <div class="panel-slot">
          <div class="panel-shadow"><div class="panel"></div></div>
          <img class="panel__logo" id="featureLogo" src="" alt="">
        </div>

        <div class="copy">
          <p class="eyebrow" id="eyebrow"></p>

          <!-- The frame holds still; app.js cross-fades logos inside it -->
          <div class="sponsor-card" id="card">
            <div class="sponsor-stack" id="stack"></div>
          </div>

          <p class="sponsor-name" id="name"></p>
        </div>

      </div>

      <div class="progress" id="progress" hidden>
        <div class="progress__fill" id="progressFill"></div>
      </div>

    </div>
  </div>

  <script src="sponsors.js"></script>
  <script src="app.js"></script>
</body>
</html>
