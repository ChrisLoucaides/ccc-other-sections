<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CCC App — phone mockup</title>
<meta name="color-scheme" content="light only">
<style>
  /* Phone mockup on a transparent canvas: 1180x2140px.
     Render with:
     chrome --headless=new --window-size=1180,2140 --default-background-color=00000000
            --screenshot=phone-mockup.png phone-mockup.html                      */
  :root { color-scheme: light only; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1180px;
    height: 2140px;
    overflow: hidden;
    background: transparent;
  }

  .stage {
    position: relative;
    width: 1180px;
    height: 2140px;
  }

  /* Same construction as the poster, scaled 1.708x (480 -> 820 wide). */
  .phone {
    position: absolute;
    top: 160px;
    left: 180px;
    width: 820px;
    height: 1660px;
    padding: 27px;
    border-radius: 106px;
    background: linear-gradient(145deg, #2c2233 0%, #120c17 55%, #221a29 100%);
    box-shadow:
      inset 0 0 0 3px rgba(255, 255, 255, .14),
      0 68px 120px rgba(18, 6, 30, .55);
  }
  .phone::before, .phone::after {
    content: '';
    position: absolute;
    right: -9px;
    width: 9px;
    border-radius: 0 5px 5px 0;
    background: #2c2233;
  }
  .phone::before { top: 300px; height: 140px; }
  .phone::after  { top: 502px; height: 222px; }

  .screen {
    width: 100%;
    height: 100%;
    border-radius: 82px;
    overflow: hidden;
    background: #3a1450;
  }
  .screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="screen">
        <img src="../../assets/Screenshot_2026-09-12-10-06-20-092_org.cypruscomiccon.app.jpg" alt="Cyprus Comic Con app home screen">
      </div>
    </div>
  </div>
</body>
</html>
